---
# Copy this file to .github/dependabot.yml.
# Add one updates entry for each other ecosystem in the repository.
# Examples are pip, uv, and npm. Delete an ecosystem the repo does not use.
# github-actions does not accept semver-major-days, semver-minor-days,
# or semver-patch-days. Use default-days only.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
