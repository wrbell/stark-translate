<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stark-translate — Operator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>stark-translate <span class="version">operator (Phase 9.1)</span></h1>
  <div class="state-pill" id="state-pill">…</div>
</header>

<main>
  <section class="card" id="preflight-card">
    <h2>Pre-flight</h2>
    <p class="hint">All red checks must clear before you can start a session. Yellow checks are warnings.</p>
    <ul class="checks" id="checks"></ul>
    <p class="meta" id="preflight-meta"></p>
  </section>

  <section class="card" id="session-card">
    <h2>Session</h2>
    <form id="config-form">
      <label>Language direction
        <select name="lang">
          <option value="en">EN → ES</option>
          <option value="es">ES → EN</option>
        </select>
      </label>
      <label>Backend
        <select name="backend">
          <option value="auto">auto</option>
          <option value="cuda">cuda</option>
          <option value="mlx">mlx</option>
        </select>
      </label>
      <label>Engine (CUDA only)
        <select name="engine">
          <option value="auto">auto (prefer llamacpp)</option>
          <option value="llamacpp">llamacpp</option>
          <option value="hf">hf (legacy)</option>
        </select>
      </label>
      <label>Mic
        <select name="mic_device" id="mic-device"><option value="">auto-detect</option></select>
      </label>
      <label>VAD threshold
        <input type="number" name="vad_threshold" min="0" max="1" step="0.05" value="0.3">
      </label>
      <label class="inline">
        <input type="checkbox" name="run_ab"> A/B comparison (E4B + E2B)
      </label>
      <label class="inline">
        <input type="checkbox" name="tts"> TTS audio
      </label>
    </form>
    <div class="actions">
      <button id="start-btn" class="primary">Start session</button>
      <button id="stop-btn" class="danger" disabled>Stop session</button>
    </div>
    <pre class="status" id="status-detail">idle</pre>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
