<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stark Road Gospel Hall — Live Translation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #fff;
    --text: #333;
    --text-dim: #777;
    --partial-color: #aaa;
    --divider: #d0d0d0;
  }

  body {
    font-family: Calibri, 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  :fullscreen { cursor: none; }
  :fullscreen .fs-btn { display: none; }

  /* Header — minimal */
  .header {
    padding: 8px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    opacity: 0.35;
    font-size: 12px;
    font-family: Calibri, sans-serif;
    border-bottom: 1px solid var(--divider);
  }

  .header:hover { opacity: 0.7; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #c44;
    display: inline-block;
    margin-right: 6px;
    vertical-align: middle;
  }
  .status-dot.connected { background: #4a4; }

  /* Stacked layout: English top, Spanish bottom */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }

  .column {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 40px 28px;
    overflow: hidden;
    min-height: 0;
  }

  .column-en {
    border-bottom: 1px solid var(--divider);
  }

  .column-label {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .text-area {
    font-size: 28px;
    line-height: 1.5;
    flex: 1;
    overflow-y: auto;
    padding-bottom: 40vh;
    -webkit-overflow-scrolling: touch;
  }

  .text-area::-webkit-scrollbar { width: 4px; }
  .text-area::-webkit-scrollbar-track { background: transparent; }
  .text-area::-webkit-scrollbar-thumb { background: var(--divider); border-radius: 2px; }

  .sentence {
    display: inline;
  }

  .sentence.partial {
    color: var(--partial-color);
    font-style: italic;
  }

  .spk {
    font-weight: 600;
    color: var(--text-dim);
    font-size: 0.78em;
    letter-spacing: 0.02em;
    margin-right: 0.25em;
  }

  /* [P7-P3-6A] Streaming translation cursor */
  .sentence.streaming {
    color: var(--text);
  }

  .streaming-cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--text-dim);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Older sentences fade */
  .sentence.age-0 { opacity: 1.0; }
  .sentence.age-1 { opacity: 0.8; }
  .sentence.age-2 { opacity: 0.55; }
  .sentence.age-3 { opacity: 0.35; }
  .sentence.age-4 { opacity: 0.2; }

  /* Fullscreen button */
  .fs-btn {
    position: fixed;
    bottom: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--divider);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 20px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-appearance: none;
    appearance: none;
  }

  body:hover .fs-btn,
  .fs-btn:focus { opacity: 0.7; }
  .fs-btn:hover { opacity: 1; }

  /* QR code overlay */
  .qr-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .qr-overlay.visible { display: flex; }

  .qr-card {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    max-width: 400px;
    width: 90%;
  }
  .qr-card h3 {
    font-size: 18px;
    color: #333;
    margin-bottom: 16px;
  }
  .qr-card canvas {
    display: block;
    margin: 0 auto 16px;
  }
  .qr-url {
    font-family: monospace;
    font-size: 14px;
    color: #555;
    word-break: break-all;
    padding: 8px 12px;
    background: #f0f0f0;
    border-radius: 8px;
  }

  .header { cursor: pointer; }

  /* Music hold indicator */
  .music-hold {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 10;
    letter-spacing: 4px;
  }
  .music-hold.visible { opacity: 0.5; }

  /* Responsive */
  @media (min-width: 1400px) {
    .text-area { font-size: 34px; }
    .column { padding: 32px 56px 36px; }
  }

  @media (min-width: 1900px) {
    .text-area { font-size: 40px; }
    .column { padding: 40px 80px 48px; }
  }
</style>
</head>
<body>

<div class="header">
  <span>Stark Road Gospel Hall</span>
  <span><span class="status-dot" id="dot"></span><span id="status">Disconnected</span></span>
</div>

<div class="content">
  <div class="column column-en">
    <div class="column-label" id="srcLabel">English</div>
    <div class="text-area" id="english"></div>
  </div>
  <div class="column column-es">
    <div class="column-label" id="tgtLabel">Español</div>
    <div class="text-area" id="spanish"></div>
  </div>
</div>

<div class="music-hold" id="musicHold">&#9835; &#9835; &#9835;</div>
<button class="fs-btn" id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen">&#x26F6;</button>

<div class="qr-overlay" id="qrOverlay">
  <div class="qr-card">
    <h3>Scan to view on your phone</h3>
    <canvas id="qrCanvas"></canvas>
    <div class="qr-url" id="qrUrl"></div>
  </div>
</div>

<script src="display_connection.js"></script>
<script src="caption_telemetry.js"></script>
<script src="operator/widgets/qr.js"></script>
<script>
(function() {
  const WS_URL = StarkDisplayConnection.websocketUrl(location);
  const FADE_COUNT = 5;  // number of recent sentences to apply fading to
  const RECONNECT_MS = 2000;

  const dot = document.getElementById('dot');
  const statusEl = document.getElementById('status');
  const spanishEl = document.getElementById('spanish');
  const englishEl = document.getElementById('english');

  // Note: "ass" (donkey), "damn" (damnation), "whore" (KJV) removed — legitimate biblical terms
  const BLOCKED = /\b(asshole|bitch|bastard|crap|cunt|dick|fuck|fucking|motherfucker|piss|shit|slut)\b/gi;
  function filter(t) { return t ? t.replace(BLOCKED, m => '*'.repeat(m.length)) : ''; }

  let sentences = [];
  let autoScrollEn = true;
  let autoScrollEs = true;
  const acceptSession = StarkDisplayConnection.sessionGuard(function() {
    sentences = [];
    autoScrollEn = autoScrollEs = true;
    document.getElementById('musicHold').classList.remove('visible');
    render();
  }, function(uid) {
    const kept = sentences.filter(s => !(s.partial && s.utterance_id === uid));
    if (kept.length === sentences.length) return;
    sentences = kept;
    render();
  });

  // Pause auto-scroll when user scrolls up, resume at bottom
  function setupAutoScroll(el, setter) {
    el.addEventListener('scroll', () => {
      // Account for padding-bottom: 40vh when detecting "at bottom"
      const padSlack = window.innerHeight * 0.4 + 40;
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < padSlack;
      setter(atBottom);
    });
  }
  setupAutoScroll(englishEl, (v) => { autoScrollEn = v; });
  setupAutoScroll(spanishEl, (v) => { autoScrollEs = v; });

  function speakerPrefix(s) {
    if (!s || !s.speaker || s.partial) return '';
    return '<span class="spk">' + esc(s.speaker) + ':</span> ';
  }

  function render() {
    const total = sentences.length;

    englishEl.innerHTML = sentences.map((s, i) => {
      const age = total - 1 - i;
      const cls = s.partial ? 'sentence partial'
        : s.streaming ? 'sentence streaming'
        : age < FADE_COUNT ? 'sentence age-' + Math.min(age, 4)
        : 'sentence age-4';
      return '<span class="' + cls + '">' + speakerPrefix(s) + esc(s.english) + ' </span>';
    }).join('');

    spanishEl.innerHTML = sentences.map((s, i) => {
      const age = total - 1 - i;
      // [P7-P3-6A] Streaming sentences get a blinking cursor
      if (s.streaming) {
        const cursor = '<span class="streaming-cursor"></span>';
        return '<span class="sentence streaming">' + speakerPrefix(s) + esc(s.spanish) + cursor + ' </span>';
      }
      const cls = s.partial ? 'sentence partial'
        : age < FADE_COUNT ? 'sentence age-' + Math.min(age, 4)
        : 'sentence age-4';
      return '<span class="' + cls + '">' + speakerPrefix(s) + esc(s.spanish) + ' </span>';
    }).join('');

    if (autoScrollEn && englishEl.lastElementChild) englishEl.lastElementChild.scrollIntoView({ block: 'end' });
    if (autoScrollEs && spanishEl.lastElementChild) spanishEl.lastElementChild.scrollIntoView({ block: 'end' });
  }

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function connect() {
    const ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      dot.classList.add('connected');
      statusEl.textContent = 'Live';
    };

    ws.onclose = () => {
      dot.classList.remove('connected');
      statusEl.textContent = 'Reconnecting...';
      setTimeout(connect, RECONNECT_MS);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = StarkCaptionTelemetry.wrap(ws, (evt) => {
      const data = JSON.parse(evt.data);
      if (!acceptSession(data)) return;

      if (data.type === 'speaker_update') {
        const sentence = sentences.find(s => s.id === data.chunk_id);
        if (sentence) { sentence.speaker = data.speaker || ''; render(); }
        return;
      }
      // Handle language config — swap column labels
      if (data.type === 'lang_config') {
        document.getElementById('srcLabel').textContent = data.source_label;
        document.getElementById('tgtLabel').textContent = data.target_label;
        return;
      }

      // Music hold indicator
      if (data.type === 'music_hold') {
        const el = document.getElementById('musicHold');
        if (data.active) el.classList.add('visible');
        else el.classList.remove('visible');
        return;
      }

      // [P7-P3-6A] Handle streaming translation tokens
      if (data.type === 'translation_start') {
        // STT completed — convert last partial to streaming, or create fresh.
        // Remove ALL partials/streaming (IDs don't match: partials use utterance_id,
        // finals use chunk_id — so ID-based matching fails).
        const en = filter(data.english || '');
        const lastPartial = sentences.filter(s => s.partial).pop();
        sentences = sentences.filter(s => !s.partial && !s.streaming);
        if (lastPartial) {
          // Keep MarianMT Spanish visible until Gemma streams in (no blank flash)
          sentences.push({
            id: 'stream-' + data.chunk_id,
            english: en,
            spanish: lastPartial.spanish,
            speaker: data.speaker || lastPartial.speaker || '',
            partial: false,
            streaming: true,
          });
        } else {
          sentences.push({
            id: 'stream-' + data.chunk_id,
            english: en,
            spanish: '',
            speaker: data.speaker || '',
            partial: false,
            streaming: true,
          });
        }
        render();
        return;
      }

      if (data.type === 'translation_stream') {
        // Progressive Spanish text from streaming generation
        const partialEs = filter(data.partial_spanish_a || '');
        const existing = sentences.find(s => s.id === 'stream-' + data.chunk_id);
        if (existing) {
          existing.spanish = partialEs;
        }
        render();
        return;
      }

      if (data.type !== 'translation') return;

      const stage = data.stage || 'complete';
      const en = filter(data.english || '');
      const es = filter(data.spanish_a || '');

      if (stage === 'partial') {
        const existing = sentences.find(s => s.id === 'p-' + data.chunk_id);
        if (existing) {
          existing.utterance_id = StarkDisplayConnection.partialUtteranceId(data);
          existing.english = en;
          existing.spanish = es;
        } else {
          sentences = sentences.filter(s => !s.partial);
          sentences.push({ id: 'p-' + data.chunk_id, utterance_id: StarkDisplayConnection.partialUtteranceId(data), english: en, spanish: es, speaker: '', partial: true, streaming: false });
        }
      } else {
        // Final translation — remove ALL partials and streaming entries.
        // (Partials use utterance_id, finals use chunk_id — IDs never match,
        // so ID-based filtering leaves orphaned partials that duplicate text.)
        sentences = sentences.filter(s => !s.partial && !s.streaming);

        const existing = sentences.find(s => s.id === data.chunk_id);
        if (existing) {
          existing.english = en;
          existing.spanish = es;
          if (data.speaker) existing.speaker = data.speaker;
        } else {
          sentences.push({ id: data.chunk_id, english: en, spanish: es, speaker: data.speaker || '', partial: false, streaming: false });
        }

        // Keep all sentences for scroll history (capped at 200 to limit memory)
        if (sentences.length > 200) {
          sentences = sentences.slice(-200);
        }
      }

      render();
    });
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }

  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'F11' || (e.metaKey && e.shiftKey && e.key === 'f')) {
      e.preventDefault();
      toggleFullscreen();
    }
  });

  // ── QR Code overlay (click header to show) ──
  (function() {
    const overlay = document.getElementById('qrOverlay');
    const header = document.querySelector('.header');
    const qrUrl = document.getElementById('qrUrl');
    const qrCanvas = document.getElementById('qrCanvas');

    header.addEventListener('click', (e) => {
      // Don't trigger if clicking status elements
      const mobileUrl = StarkDisplayConnection.mobileUrl(location);
      qrUrl.textContent = mobileUrl;
      qrCanvas.hidden = !StarkQR.draw(qrCanvas, mobileUrl, 200);
      overlay.classList.add('visible');
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('visible');
    });

  })();

  connect();
})();
</script>
</body>
</html>
