name: PyPI Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the actual publish (test build only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write          # required for OIDC Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install build twine

      - name: Read version from pyproject.toml
        id: version
        run: |
          v=$(python -c 'import tomllib; print(tomllib.loads(open("pyproject.toml","rb").read().decode())["project"]["version"])')
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Building stark-translate==$v"

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify with twine
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/stark-translate
    if: github.event_name == 'push' && github.ref_type == 'tag' && !inputs.dry_run
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` — Trusted Publishing uses OIDC. PyPI must be
        # configured to trust the wrbell/stark-translate repo for this
        # workflow. Set up at https://pypi.org/manage/account/publishing/.
