name: Docker Image (GHCR)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Override image tag (defaults to git ref)"
        type: string
        required: false
      push:
        description: "Push to GHCR (false = build-only smoke test)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write          # required to push to ghcr.io
  id-token: write          # for cosign keyless signing (future)

env:
  REGISTRY: ghcr.io
  # Lowercase repo name — GHCR rejects mixed case, so don't trust the org name verbatim.
  IMAGE_NAME: ${{ github.repository_owner }}/stark-translate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Build the multi-stage CUDA image. linux/amd64 only — the image
      # depends on nvidia/cuda base images that don't ship arm64 variants.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CUDA_VERSION=12.6.3
            UBUNTU_VERSION=24.04
            CUDA_ARCHS=89

      - name: Image digest
        if: steps.meta.outputs.tags
        run: |
          echo "Pushed images:"
          echo "${{ steps.meta.outputs.tags }}"
