name: Security

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday 8AM UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      requirements_changed: ${{ steps.filter.outputs.requirements }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            requirements:
              - 'requirements*.txt'

  audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.requirements_changed == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements-mac.txt
          - requirements-windows.txt
          - requirements-nvidia.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-mac.txt
            requirements-windows.txt
            pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit setuptools

      - name: Audit ${{ matrix.requirements }}
        run: |
          # Strip packages that can't resolve on Linux CI:
          #   mlx* (macOS Metal only), piper-tts (native binary)
          #   inaSpeechSegmenter, demucs, pyannote-audio (complex native builds)
          #   unbabel-comet (transitive pandas build fails without pkg_resources)
          #   torch* (CUDA-specific index URLs)
          sed -E \
            -e '/^mlx/d' \
            -e '/^piper-tts/d' \
            -e '/^inaSpeechSegmenter/d' \
            -e '/^demucs/d' \
            -e '/^pyannote-audio/d' \
            -e '/^unbabel-comet/d' \
            -e '/^pandas/d' \
            -e '/^torch(audio|vision)?[>=<]/d' \
            -e '/^--/d' \
            -e '/^#/d' \
            -e '/^\s*$/d' \
            "${{ matrix.requirements }}" > /tmp/audit-reqs.txt
          echo "Auditing packages:"
          cat /tmp/audit-reqs.txt
          pip-audit -r /tmp/audit-reqs.txt --desc --no-deps

  security:
    # Gate job: always runs, required for branch protection.
    # Passes if audit was skipped (no requirements changes) or all audits passed.
    needs: [detect-changes, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check audit results
        run: |
          if [ "${{ needs.audit.result }}" = "failure" ] || [ "${{ needs.audit.result }}" = "cancelled" ]; then
            echo "Security audit failed or was cancelled"
            exit 1
          fi
          echo "Security gate passed (audit result: ${{ needs.audit.result }})"
