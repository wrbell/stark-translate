name: Security

on:
  schedule:
    - cron: "0 8 * * 1"  # Monday 8AM UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      requirements_changed: ${{ steps.filter.outputs.requirements }}
      lite_changed: ${{ steps.filter.outputs.lite }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            requirements:
              - 'requirements*.txt'
            lite:
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'stark_translate/profiles.py'
              - 'bootstrap.sh'
              - 'tools/check_dependency_audit.py'
              - '.github/workflows/security.yml'

  audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.requirements_changed == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements-mac.txt
          - requirements-windows.txt
          - requirements-nvidia.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-mac.txt
            requirements-windows.txt
            pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit setuptools

      - name: Audit ${{ matrix.requirements }}
        run: |
          # Strip packages that can't resolve on Linux CI:
          #   mlx* (macOS Metal only), piper-tts (native binary)
          #   inaSpeechSegmenter, demucs, pyannote-audio (complex native builds)
          #   unbabel-comet (transitive pandas build fails without pkg_resources)
          #   torch* (CUDA-specific index URLs)
          sed -E \
            -e '/^mlx/d' \
            -e '/^piper-tts/d' \
            -e '/^inaSpeechSegmenter/d' \
            -e '/^demucs/d' \
            -e '/^pyannote-audio/d' \
            -e '/^unbabel-comet/d' \
            -e '/^pandas/d' \
            -e '/^torch(audio|vision)?[>=<]/d' \
            -e '/^--/d' \
            -e '/^#/d' \
            -e '/^\s*$/d' \
            "${{ matrix.requirements }}" > /tmp/audit-reqs.txt
          echo "Auditing packages:"
          cat /tmp/audit-reqs.txt
          pip-audit -r /tmp/audit-reqs.txt --desc --no-deps

  audit-lite:
    needs: detect-changes
    if: needs.detect-changes.outputs.lite_changed == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit tool separately from the Lite target
        run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83.0.0' pip-audit

      - name: Resolve the actual Lite CPU and TTS installation
        run: |
          python -m venv .venv-lite-audit
          .venv-lite-audit/bin/python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83.0.0'
          .venv-lite-audit/bin/python -m pip install '.[lite-cpu,tts]'
          .venv-lite-audit/bin/python -m pip check

      - name: Audit every installed Lite dependency
        run: |
          LITE_SITE_PACKAGES=$(.venv-lite-audit/bin/python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          pip-audit --path "$LITE_SITE_PACKAGES" --format json --output lite-installed-audit.json
          python tools/check_dependency_audit.py lite-installed-audit.json

      - name: Retain the installed dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lite-installed-audit
          path: lite-installed-audit.json
          if-no-files-found: warn

  security:
    # Gate job: always runs, required for branch protection.
    # Skipped audits are allowed only when change detection did not request them.
    needs: [detect-changes, audit, audit-lite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check audit results
        run: |
          if [ "${{ needs.detect-changes.result }}" != "success" ]; then
            echo "Security change detection failed or was cancelled"
            exit 1
          fi
          LEGACY_REQUIRED="${{ needs.detect-changes.outputs.requirements_changed == 'true' || github.event_name == 'schedule' }}"
          LITE_REQUIRED="${{ needs.detect-changes.outputs.lite_changed == 'true' || github.event_name == 'schedule' }}"
          check_audit() {
            if [ "$2" = "success" ]; then return; fi
            if [ "$1" = "false" ] && [ "$2" = "skipped" ]; then return; fi
            echo "Security audit failed, was cancelled, or was unexpectedly skipped: $3 ($2)"
            exit 1
          }
          check_audit "$LEGACY_REQUIRED" "${{ needs.audit.result }}" legacy
          check_audit "$LITE_REQUIRED" "${{ needs.audit-lite.result }}" installed-lite
          echo "Security gate passed"
