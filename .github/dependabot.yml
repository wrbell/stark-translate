version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Frozen requirements-*.txt snapshot is deprecated (v2026.7 extras).
    # pip-audit CI is the security gate; do not keep opening version-update PRs.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # v3 PrerecordedOptions API is still used by training/transcribe_with_deepgram.py.
      # v4+ is a Fern rewrite; do not auto-open major bumps.
      - dependency-name: "deepgram-sdk"
        versions: [">=4.0.0"]
      # sympy==1.14.0 (latest) requires mpmath<1.4; 1.4.1 has no compatible consumer yet.
      - dependency-name: "mpmath"
        versions: [">=1.4.0"]
      # Training stack is on trl 0.29 / SFTTrainer 0.x; 1.x is a breaking rewrite.
      - dependency-name: "trl"
        versions: [">=1.0.0"]
      # datasets 4.x+ needs torchcodec; training pin stays <4.0.
      - dependency-name: "datasets"
        versions: [">=4.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
