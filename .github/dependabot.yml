version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # v3 PrerecordedOptions API is still used by training/transcribe_with_deepgram.py.
      # v4+ is a Fern rewrite; do not auto-open major bumps.
      - dependency-name: "deepgram-sdk"
        versions: [">=4.0.0"]
      # sympy==1.14.0 (latest) requires mpmath<1.4; 1.4.1 has no compatible consumer yet.
      - dependency-name: "mpmath"
        versions: [">=1.4.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
