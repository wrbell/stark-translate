---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      # enforcement/ and the two tools/ checkers are byte-identical copies
      # from wrbell/standards (adopt_standards.py --check); do not reformat.
      - id: ruff
        args: [--fix]
        exclude: ^(enforcement/|tools/(agents_md_lint|check_docs)\.py$)
      - id: ruff-format
        exclude: ^(enforcement/|tools/(agents_md_lint|check_docs)\.py$)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Retained corpora and evaluation artifacts are hash-bound evidence.
        exclude: ^(bible_data/|stark_data/|docs/archive/|docs/evaluation/|docs/mac_pipeline_refresh_20260830\.md$)
      - id: end-of-file-fixer
        exclude: ^(bible_data/|stark_data/|docs/archive/|docs/evaluation/|docs/mac_pipeline_refresh_20260830\.md$)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict

  # Added by standards/tools/adopt_standards.py.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: '\.(yaml|yml)$'
        args:
          - -c
          - enforcement/yamllint/.yamllint.yml
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck v0.11.0
        entry: shellcheck --severity=style --rcfile=enforcement/shellcheck/.shellcheckrc
        language: system
        types:
          - shell
        exclude: '^(\.agents/|third_party/)'
      - id: check-docs
        name: check docs structure
        entry: python3 tools/check_docs.py
        language: system
        pass_filenames: false
        files: '^(README\.md|docs/decisions/.+\.md|templates/README\.template\.md)$'
      - id: agents-md-lint
        name: 'Check AGENTS.md, CLAUDE.md, and Cursor rules'
        entry: python3 tools/agents_md_lint.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args:
          - -i
          - '2'
          - -ci
          - -bn
        exclude: '^(\.agents/|third_party/)'
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args:
          - --config
          - enforcement/markdownlint/.markdownlint-cli2.yaml
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v8.19.1
    hooks:
      - id: cspell
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --gitignore
          - --config
          - enforcement/cspell/cspell.json
          - --files
        stages:
          - manual
