[project]
name = "stark-translate"
version = "2026.7.0.0"
requires-python = ">=3.11,<3.13"
description = "Live bilingual speech-to-text for church outreach"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Willem Bell" }]
keywords = ["speech-to-text", "translation", "whisper", "llama.cpp", "live-subtitling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Base dependencies — shared by every channel (operator UI, displays, settings).
# Heavy ML deps go behind the [cuda] / [mlx] / [cpu] extras so a slim install is possible.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=16.0",
    "psutil>=5.9",
    "loguru>=0.7",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "sounddevice>=0.5",
]

[project.scripts]
stark-translate = "operator_app.cli:main"

[project.urls]
Homepage = "https://github.com/wrbell/stark-translate"
Documentation = "https://github.com/wrbell/stark-translate/blob/main/docs/operator_runbook.md"
Issues = "https://github.com/wrbell/stark-translate/issues"

[project.optional-dependencies]
# --------------------------------------------------------------------------
# Hardware-backend extras — pick exactly one for your platform.
# --------------------------------------------------------------------------
# CUDA / NVIDIA. Pin notes:
#   - ctranslate2 ≥4.5 needs CUDA 12.3+ / cuDNN 9. Older toolchains:
#       CUDA 11 + cuDNN 8 → pin "ctranslate2<=3.24.0"
#       CUDA 12 + cuDNN 8 → pin "ctranslate2<=4.4.0"
#     Document explicitly in docs/packaging/pypi.md per platform.
cuda = [
    "torch>=2.6,<3",
    "transformers>=5.5",
    "ctranslate2>=4.5",
    "faster-whisper>=1.1",
    "bitsandbytes>=0.43",
    "scipy>=1.13",
    "piper-tts",
]

# MLX / Apple Silicon. arm64 only.
mlx = [
    "mlx>=0.31",
    "mlx-whisper>=0.4",
    "mlx-lm>=0.30",
    "transformers>=5.5",
    "scipy>=1.13",
    "piper-tts",
]

# CPU fallback — no GPU acceleration. Slow but works on any machine.
cpu = [
    "torch>=2.6,<3",
    "transformers>=5.5",
    "ctranslate2>=4.5",
    "faster-whisper>=1.1",
    "scipy>=1.13",
    "piper-tts",
]

# Developer tools — lint, test, build.
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "bandit>=1.7",
    "vulture>=2.11",
    "httpx>=0.28",                        # for fastapi.testclient
    "build>=1.2",                         # python -m build
]

# ---------------------------------------------------------------------------
# Build system — hatchling with explicit package + data inclusion
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operator_app", "engines", "tools", "features"]

[tool.hatch.build.targets.wheel.force-include]
"settings.py" = "settings.py"
"dry_run_ab.py" = "dry_run_ab.py"
"models.lock.json" = "models.lock.json"
"displays" = "displays"
"scripts/dry_run_rehearsal.sh" = "scripts/dry_run_rehearsal.sh"
"start_server.sh" = "start_server.sh"
"run_operator.sh" = "run_operator.sh"

[tool.hatch.build.targets.sdist]
include = [
    "operator_app",
    "engines",
    "tools",
    "features",
    "displays",
    "scripts",
    "tests",
    "settings.py",
    "dry_run_ab.py",
    "models.lock.json",
    "pyproject.toml",
    "README.md",
    "CLAUDE.md",
    "*.sh",
]
exclude = [
    "stt-data",
    "stark_data",
    "whisper_ablation",
    "hybrid_runs",
    "ablation",
    "metrics/*.csv",
    "metrics/*.jsonl",
    "metrics/*.log",
    "models/*.gguf",
    ".venv",
    "venv",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "bible_data/scrollmapper",
    "stt_env",
    "stt_train_env",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length — handled by formatter
    "E402",   # module-level import not at top (conditional imports throughout)
    "E731",   # lambda assignment (used for closures in HTTP handler etc.)
    "E741",   # ambiguous variable name (common in ML: l, I, O)
    "B007",   # unused loop control variable (rename to _ is noisy)
    "B008",   # function call in default argument (Pydantic Field())
    "B905",   # zip() without strict= (too pervasive, low value)
    "SIM103", # return condition directly — multi-condition readability
    "SIM110", # use any() — for-loop-with-return is often clearer
    "SIM105", # contextlib.suppress — try/except/pass is clearer for I/O
    "SIM108", # ternary operator — readability preference
    "SIM115", # context manager for open() — not always appropriate
    "SIM210", # bool() instead of ternary — style preference
    "RUF002", # ambiguous unicode in docstrings (multiplication sign etc.)
    "RUF012", # mutable class variable (Pydantic model_config)
    "RUF013", # implicit Optional — existing codebase convention
    "RUF034", # useless if-else (intentional for clarity in config)
    "RUF059", # unused unpacked variable — false positives with API returns
]

[tool.ruff.lint.isort]
known-first-party = ["engines", "features", "tools", "training", "settings"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "engines.base",
    "engines.factory",
    "engines.active_learning",
    "settings",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "engines.mlx_engine",
    "engines.cuda_engine",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "training.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that take >10s (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU/model downloads (deselect with '-m \"not gpu\"')",
]

# ---------------------------------------------------------------------------
# Briefcase — Windows MSI packaging (Track 3, v2026.7.2.0+)
# ---------------------------------------------------------------------------
# Briefcase wraps the PyApp launcher (built by .github/workflows/release-win.yml)
# into a WiX MSI. The fragment at packaging/windows/wix-fragment.wxi is composed
# in. Code signing is deferred to v2026.7.2.1 (Sectigo/DigiCert cert procurement);
# v2026.7.2.0 ships unsigned with documented SmartScreen click-through.
[tool.briefcase]
project_name = "Stark Translate"
bundle = "com.starkroad"
version = "2026.7.0.0"
url = "https://github.com/wrbell/stark-translate"
license.file = "LICENSE"

[tool.briefcase.app.stark-translate]
formal_name = "Stark Translate"
description = "Live bilingual speech-to-text + translation for church outreach."
long_description = """
A fully on-device live English/Spanish speech-to-text and translation system,
built for non-technical volunteers. Runs the operator control plane on
http://localhost:9000/ and audience displays on :8080. Detects NVIDIA GPUs at
install time and pip-installs either the [cuda] or [cpu] extras of
stark-translate accordingly.
"""
sources = ["operator_app", "engines", "tools", "features"]
icon = "packaging/windows/icon"
# The actual launcher binary is PyApp (see packaging/windows/pyapp-config.toml).
# Briefcase's "external app packaging" mode wraps that pre-built .exe instead
# of running its standard Python-stub builder.
external_package_path = "packaging/windows/stark-translate.exe"

[tool.briefcase.app.stark-translate.windows]
use_full_install_path = true
template_branch = "v0.3.25"
# Custom WiX fragment adds Start Menu shortcut, NVIDIA detection custom action,
# ARP metadata. See packaging/windows/wix-fragment.wxi.
template_extra_includes = ["packaging/windows/wix-fragment.wxi"]
# Versioning aligned with CalVer; Briefcase requires four numeric components.
target_version = "2026.7.2.0"
